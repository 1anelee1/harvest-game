<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сбор урожая</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: phone-shaped game card. Top third: fruit queue on a winding farm path that ends at a gate.
   Middle strip: parking row (VIP, 4 open slots, 2 locked "+"). Bottom: a jam of vans with arrows.
   Below the card: three chunky blue helper buttons. One bright, sunny look on purpose. */
:root {
  color-scheme: light;
  --page: #c8d2ea;
  --blue: #3b8cff;
  --blue-top: #63a6ff;
  --blue-dark: #1d5dc4;
  --ink: #1d2340;
  --muted: #4d5677;
  --outline: #333a5c;
  --gold: #ffc83d;
  --green: #34c26d;
  --card: #ffffff;
  --display: "Russo One", "Arial Black", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.wrap { max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.game { position: relative; border-radius: 24px; overflow: hidden; background: #e2e6f3; box-shadow: 0 12px 30px rgba(40,50,90,.25); }
canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 400 / 750; touch-action: manipulation; cursor: pointer; }

.hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
.sq { pointer-events: auto; appearance: none; border: 0; width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(var(--blue-top), var(--blue)); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 0 var(--blue-dark), inset 0 2px 0 rgba(255,255,255,.35); }
.hud-r { display: flex; gap: 8px; }
.hud2 { position: absolute; top: 62px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
.pill { display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px 0 5px; border-radius: 15px; background: rgba(29,35,64,.78); color: #fff; font: 15px var(--display); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.skybar { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 6px; border-radius: 15px; background: rgba(29,35,64,.78); color: #fff; font: 14px var(--display); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.skybar .sb-ico { font-size: 16px; line-height: 1; }
.skybar .sb-track { position: relative; width: 82px; height: 12px; border-radius: 6px; background: linear-gradient(90deg, #2b3a66, #55607f); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
.skybar .sb-track i { position: absolute; inset: 0; transform-origin: left; border-radius: 6px; background: linear-gradient(90deg, #ff7a1a, #ffb52e 45%, #ffe56b); box-shadow: inset 0 2px 0 rgba(255,255,255,.45); }
.skybar #timer { min-width: 34px; text-align: right; }
.skybar.low { background: #3a4a7a; animation: beat .5s ease-in-out infinite alternate; }
.skybar.low .sb-track i { background: linear-gradient(90deg, #e5333d, #ff7a5a); }
.pill.bump { animation: bump .35s ease-out; }
@keyframes beat { to { transform: scale(1.08); } }
@keyframes bump { 40% { transform: scale(1.25); } }
.coin { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3a0, #ffc83d 45%, #d18a00); box-shadow: inset 0 0 0 2px #b87400; display: grid; place-items: center; font: 12px var(--display); color: #8a5600; }
.badge.price { background: var(--gold); color: #6b4300; display: flex; align-items: center; gap: 3px; padding: 0 6px 0 3px; min-width: 0; }
.badge.price .coin { width: 15px; height: 15px; font-size: 9px; }
@media (prefers-reduced-motion: reduce) { .skybar.low, .pill.bump { animation: none; } }
.sq.off { background: linear-gradient(#9aa3bd, #7d87a3); box-shadow: 0 4px 0 #5b6380, inset 0 2px 0 rgba(255,255,255,.35); }
.sq:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-dark); }
.lvl { font: 400 1.45rem var(--display); color: #fff; -webkit-text-stroke: 5px var(--outline); paint-order: stroke fill; letter-spacing: .02em; text-shadow: 0 3px 0 var(--outline); }

.toast { position: absolute; left: 14px; right: 14px; top: 56%; background: rgba(29,35,64,.92); color: #fff; border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: .9rem; line-height: 1.35; text-align: center; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }

.helpers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-top: 6px; }
.helper { appearance: none; border: 0; position: relative; border-radius: 20px; padding: 8px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
  background: linear-gradient(var(--blue-top), var(--blue)); box-shadow: 0 6px 0 var(--blue-dark), inset 0 2px 0 rgba(255,255,255,.35);
  color: #fff; font: 900 .88rem var(--body); text-shadow: 0 2px 0 var(--blue-dark); }
.helper:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--blue-dark); }
.helper[disabled] { filter: grayscale(.9) brightness(.85); cursor: not-allowed; }
.helper.armed { outline: 4px solid var(--gold); outline-offset: 2px; }
.helper .ico { height: 44px; display: grid; place-items: center; }
.helper .ico svg { width: 44px; height: 44px; }
.ball { width: 38px; height: 38px; border-radius: 50%; background: conic-gradient(#ff5a5a, #ffc83d, #4cd964, #3bc4ff, #3b6dff, #b05cff, #ff5ab4, #ff5a5a); box-shadow: inset -5px -6px 0 rgba(0,0,0,.15), inset 4px 4px 0 rgba(255,255,255,.4); }
.badge { position: absolute; top: -8px; right: -6px; min-width: 26px; height: 26px; border-radius: 13px; padding: 0 6px; background: var(--green); border: 2px solid #fff; color: #fff; display: grid; place-items: center; font: 13px var(--display); text-shadow: none; }
.sq:focus-visible, .helper:focus-visible, .ov-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.overlay { position: absolute; inset: 0; background: rgba(29,35,64,.55); display: grid; place-items: center; padding: 22px; backdrop-filter: blur(2px); }
.overlay[hidden] { display: none; }
.ov-card { background: var(--card); border-radius: 22px; padding: 22px 20px; max-width: 320px; display: flex; flex-direction: column; gap: 10px; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.15); }
.ov-card h2 { margin: 0; font: 400 1.6rem var(--display); color: var(--ink); text-wrap: balance; }
.ov-card p { margin: 0; color: var(--muted); line-height: 1.45; font-weight: 600; }
.ov-card ul { margin: 0; padding-left: 18px; text-align: left; color: var(--muted); line-height: 1.45; font-weight: 600; font-size: .9rem; display: flex; flex-direction: column; gap: 4px; }
.ov-card ul b { color: var(--ink); }
.ov-ico { font-size: 2.6rem; line-height: 1; margin-bottom: 4px; }
.reward { display: flex; align-items: center; justify-content: center; gap: 6px; font: 1.2rem var(--display); color: #b87400; margin: 6px 0 0; }
.stars { display: flex; justify-content: center; gap: 6px; font-size: 2.4rem; line-height: 1; }
.star { color: #d9dcea; }
.star.on { color: var(--gold); text-shadow: 0 3px 0 #c98d00; }
.lv-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lv { appearance: none; border: 0; border-radius: 14px; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer;
  font: 400 1.2rem var(--display); color: #fff; background: linear-gradient(var(--blue-top), var(--blue)); box-shadow: 0 4px 0 var(--blue-dark); }
.lv small { font-size: .62rem; color: #ffe14d; letter-spacing: .05em; min-height: .8em; }
.lv.cur { outline: 3px solid var(--gold); outline-offset: 2px; }
.lv[disabled] { background: #c9cede; box-shadow: 0 4px 0 #a6acc0; cursor: not-allowed; font-size: 1rem; }
.ov-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }
.ov-btn { appearance: none; border: 0; border-radius: 14px; padding: 12px 18px; cursor: pointer; font: 900 1rem var(--body); color: #fff; background: linear-gradient(#4fdc86, var(--green)); box-shadow: 0 4px 0 #1f8a4a; }
.ov-btn.alt { background: linear-gradient(var(--blue-top), var(--blue)); box-shadow: 0 4px 0 var(--blue-dark); }

/* splash + main menu: full screen over everything */
.screen { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px;
  background: linear-gradient(#5cc4ff 0%, #a9e4ff 36%, #d9f6ff 44%, #7ee64a 44.2%, #4fcb2c 70%, #23901a 100%); transition: opacity .6s ease, transform .6s ease; overflow: hidden; }
.screen[hidden] { display: none; }
.screen.out { opacity: 0; pointer-events: none; }
.screen.menu.enter { opacity: 0; transform: scale(1.04); }
.logo { position: relative; text-align: center; }
.logo-fruits { display: flex; justify-content: center; gap: 4px; margin-bottom: -6px; }
.logo-fruits svg { width: 52px; height: 52px; filter: drop-shadow(0 5px 3px rgba(0,60,0,.35)); animation: hop 1.1s ease-in-out infinite; }
.logo-fruits svg:nth-child(2) { animation-delay: .12s; } .logo-fruits svg:nth-child(3) { animation-delay: .24s; }
.logo-fruits svg:nth-child(4) { animation-delay: .36s; } .logo-fruits svg:nth-child(5) { animation-delay: .48s; } .logo-fruits svg:nth-child(6) { animation-delay: .6s; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-12px) rotate(-6deg); } }
.logo h1 { margin: 0; font: 400 clamp(2.6rem, 13vw, 4.2rem)/1 var(--display); color: #ffe14d; letter-spacing: .01em;
  -webkit-text-stroke: 8px #7a3d00; paint-order: stroke fill; text-shadow: 0 6px 0 #7a3d00, 0 12px 18px rgba(0,50,0,.35); transform: rotate(-3deg); }
.logo h1 span { display: block; color: #fff; font-size: .62em; margin-top: 6px; }
.splash .logo { animation: logoIn .7s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes logoIn { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.splash .loading { width: 160px; height: 12px; border-radius: 6px; background: rgba(0,60,0,.3); overflow: hidden; }
.splash .loading i { display: block; height: 100%; width: 0; border-radius: 6px; background: linear-gradient(#fff6a0, #ffc83d); animation: load 1.9s ease-in-out forwards; }
@keyframes load { to { width: 100%; } }
.sun { position: absolute; top: 5%; right: 10%; width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #fff7b0, #ffd23f 55%, #ffab1f);
  box-shadow: 0 0 0 10px rgba(255,220,80,.25), 0 0 40px 18px rgba(255,210,60,.45); animation: glow 3s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 0 0 16px rgba(255,220,80,.18), 0 0 54px 24px rgba(255,210,60,.5); } }
.cloud { position: absolute; width: 110px; height: 34px; border-radius: 20px; background: #fff; opacity: .95; animation: drift linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 50px; height: 50px; left: 16px; top: -26px; }
.cloud::after { width: 38px; height: 38px; left: 54px; top: -18px; }
@keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(calc(100vw + 40px)); } }
.ftree { position: absolute; bottom: 52%; width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #7ee85a, #1f9e2a 70%, #157a1c); box-shadow: 0 4px 0 rgba(0,60,0,.2); }
.ftree::after { content: ""; position: absolute; left: 20px; top: 42px; width: 7px; height: 14px; border-radius: 2px; background: #7a4a22; z-index: -1; }
.story { margin: 0; max-width: 300px; padding: 12px 16px; border-radius: 16px; background: rgba(255,255,255,.92); color: #3a2a10; font: 800 1.02rem/1.35 var(--body); text-align: center; box-shadow: 0 6px 0 rgba(0,60,0,.25); }
.story b { color: #c25e00; }
.menu .logo, .menu .story, .menu .menu-info, .menu .play, .menu .menu-row { position: relative; z-index: 1; }
@media (prefers-reduced-motion: reduce) { .cloud, .sun { animation: none; } }
.menu .logo h1 { font-size: clamp(2.2rem, 11vw, 3.4rem); }
.menu-info { display: flex; gap: 10px; }
.menu-info .pill { height: 36px; font-size: 1rem; padding: 0 14px 0 6px; }
.menu-info .pill.lvl-pill { padding: 0 14px; }
.play { appearance: none; border: 0; cursor: pointer; width: min(280px, 80vw); padding: 18px 0 20px; border-radius: 26px; font: 400 2rem var(--display); color: #fff;
  background: linear-gradient(#ffd84a, #ff9f1c); box-shadow: 0 8px 0 #c25e00, 0 14px 24px rgba(0,50,0,.35), inset 0 3px 0 rgba(255,255,255,.55);
  -webkit-text-stroke: 5px #a34a00; paint-order: stroke fill; animation: pulse 1.4s ease-in-out infinite; }
.play:active { transform: translateY(6px); box-shadow: 0 2px 0 #c25e00; animation: none; }
@keyframes pulse { 50% { transform: scale(1.05); } }
.menu-row { display: flex; gap: 12px; }
.menu-row .sq { width: auto; height: 50px; padding: 0 18px; gap: 8px; display: flex; font: 900 1rem var(--body); }
.deco { position: absolute; bottom: -10px; width: 90px; height: 70px; border-radius: 50% 50% 0 0; background: radial-gradient(circle at 40% 30%, #6fe04a, #17861f); opacity: .9; }
@media (prefers-reduced-motion: reduce) { .logo-fruits svg, .play, .splash .logo { animation: none; } .splash .loading i { animation-duration: .01s; } }
</style>
<style>html, body { margin: 0; } [hidden] { display: none !important; }</style>
</head>
<body>
<div class="wrap">
  <div class="game" id="game">
    <canvas id="cv" width="400" height="750" aria-label="Игровое поле: очередь фруктов, парковка и пробка из ящиков"></canvas>
    <div class="hud">
      <button class="sq" id="restartBtn" aria-label="Начать уровень заново">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 3.8v4.6h4.6"/></svg>
      </button>
      <span class="lvl" id="lvl">Уровень 1</span>
      <div class="hud-r">
        <button class="sq" id="soundBtn" aria-label="Выключить звук" aria-pressed="false">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5h3.5l5-4v13l-5-4H3.5z" fill="#fff"/><g class="waves"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.2 6.4a7.6 7.6 0 0 1 0 11.2"/></g><g class="cross" style="display:none"><path d="M15.5 9.2l5 5.6M20.5 9.2l-5 5.6"/></g></svg>
        </button>
        <button class="sq" id="pauseBtn" aria-label="Пауза и правила">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
        </button>
      </div>
    </div>
    <div class="hud2">
      <span class="pill" aria-label="Монеты"><span class="coin">$</span><span id="coins">0</span></span>
      <span class="skybar" id="skybar" role="timer" aria-label="Время до дождя"><span class="sb-ico" aria-hidden="true">☀️</span><span class="sb-track"><i id="timerFill"></i></span><span id="timer">2:00</span><span class="sb-ico" aria-hidden="true">🌧️</span></span>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="overlay" id="overlay" hidden>
      <div class="ov-card" id="ovCard"></div>
    </div>
  </div>

  <div class="helpers">
    <button class="helper" id="vipBtn">
      <span class="ico"><svg viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="4" rx="2" fill="#ffd36b"/><rect x="22" y="8" width="4" height="8" fill="#9a6a00"/><rect x="8" y="16" width="32" height="20" rx="8" fill="#ff9f1c"/><rect x="26" y="19" width="10" height="9" rx="3" fill="#bfe6ff"/><circle cx="15" cy="37" r="4" fill="#2b2f45"/><circle cx="33" cy="37" r="4" fill="#2b2f45"/></svg></span>
      VIP<span class="badge price"><span class="coin">$</span>100</span>
    </button>
    <button class="helper" id="sortBtn">
      <span class="ico"><svg viewBox="0 0 48 48"><rect x="5" y="12" width="38" height="28" rx="5" fill="#a96a32"/><rect x="5" y="10" width="38" height="26" rx="5" fill="#e0a868" stroke="#6e4119" stroke-width="2"/><rect x="10" y="15" width="8" height="8" rx="2" fill="#ff1f2a"/><rect x="20" y="15" width="8" height="8" rx="2" fill="#ffd700"/><rect x="30" y="15" width="8" height="8" rx="2" fill="#32cd32"/><rect x="10" y="25" width="8" height="7" rx="2" fill="#1f5fff"/><rect x="20" y="25" width="8" height="7" rx="2" fill="#a020f0"/><rect x="30" y="25" width="8" height="7" rx="2" fill="#ff8c00"/></svg></span>
      Упорядочить<span class="badge" id="sortCount">1</span>
    </button>
    <button class="helper" id="shuffleBtn">
      <span class="ico"><span class="ball"></span></span>
      Перемешать<span class="badge price"><span class="coin">$</span>50</span>
    </button>
  </div>
</div>

<div class="screen splash" id="splash" aria-label="Сбор урожая">
  <span class="sun" aria-hidden="true"></span><span class="cloud" style="top:9%;animation-duration:38s;animation-delay:-12s" aria-hidden="true"></span><span class="cloud" style="top:22%;animation-duration:52s;animation-delay:-30s;transform:scale(.8)" aria-hidden="true"></span>
  <span class="ftree" style="left:6%" aria-hidden="true"></span><span class="ftree" style="left:20%;width:34px;height:34px" aria-hidden="true"></span><span class="ftree" style="right:8%;width:40px;height:40px" aria-hidden="true"></span>
    <div class="logo"><div class="logo-fruits" data-fruits></div><h1>Сбор<span>урожая</span></h1></div>
  <div class="loading" aria-hidden="true"><i></i></div>
  <span class="deco" style="left:-20px"></span><span class="deco" style="right:-24px;width:110px"></span>
</div>
<div class="screen menu" id="menu" hidden>
  <span class="sun" aria-hidden="true"></span><span class="cloud" style="top:9%;animation-duration:38s;animation-delay:-12s" aria-hidden="true"></span><span class="cloud" style="top:22%;animation-duration:52s;animation-delay:-30s;transform:scale(.8)" aria-hidden="true"></span>
  <span class="ftree" style="left:6%" aria-hidden="true"></span><span class="ftree" style="left:20%;width:34px;height:34px" aria-hidden="true"></span><span class="ftree" style="right:8%;width:40px;height:40px" aria-hidden="true"></span>
    <div class="logo"><div class="logo-fruits" data-fruits></div><h1>Сбор<span>урожая</span></h1></div>
  <div class="menu-info">
    <span class="pill"><span class="coin">$</span><span id="menuCoins">0</span></span>
    <span class="pill lvl-pill" id="menuLevel">Уровень 1</span>
  </div>
  <p class="story">Помоги фермеру собрать и отправить все фрукты <b>до дождя!</b></p>
  <button class="play" id="playBtn">Играть</button>
  <div class="menu-row">
    <button class="sq" id="menuLevels">Уровни</button>
    <button class="sq" id="menuSound">Звук: вкл</button>
  </div>
  <span class="deco" style="left:-20px"></span><span class="deco" style="right:-24px;width:110px"></span>
</div>

<script>
(() => {
  // ---------- data ----------
  // red = клубника, yellow = банан, green = яблоко, blue = голубика, purple = виноград, orange = апельсин
  const PAL = {
    red:    { base: '#ff1f2a', light: '#ff7078', dark: '#c40812', of: 'клубники' },
    yellow: { base: '#ffd700', light: '#ffeb6b', dark: '#d49a00', of: 'бананов' },
    green:  { base: '#32cd32', light: '#7ef07e', dark: '#169a16', of: 'яблок' },
    blue:   { base: '#1f5fff', light: '#6d9aff', dark: '#0f38c0', of: 'голубики' },
    purple: { base: '#a020f0', light: '#c873ff', dark: '#6a0cb0', of: 'винограда' },
    orange: { base: '#ff8c00', light: '#ffbb55', dark: '#c95e00', of: 'апельсинов' },
  };
  const HIDDEN = { base: '#454a5e', light: '#5c6178', dark: '#262a38' };

    ctx.lineJoin = 'round'; ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(30,20,40,.75)'; ctx.strokeText(text, x, y + 1);
    ctx.fillStyle = '#fff'; ctx.fillText(text, x, y + 1);
    ctx.restore();
  }

  function tickTimer(dt) {
    if (S.over || S.paused || !$('overlay').hidden) return;
    S.time = Math.max(0, S.time - dt);
    $('timerFill').style.transform = `scaleX(${(S.time / S.timeMax).toFixed(4)})`;
    const sec = Math.ceil(S.time);
    if (sec !== S.timeShown) {
      S.timeShown = sec;
      const el = $('timer'); el.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
      $('skybar').classList.toggle('low', sec <= 15);
      if (sec <= 5 && sec > 0) sfx('tick');
    }
    if (S.time <= 0) { S.over = true; timeUp(); }
  }
  let lastFrame = 0;
  function frame(now) {
    if (S) {
      tickTimer(Math.min(.25, (now - (lastFrame || now)) / 1000));
      update(now);
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, W, H);
      drawScene(now);
    }
    lastFrame = now;
    requestAnimationFrame(frame);
  }

  // ---------- messages ----------
  const toastEl = $('toast'); let toastTimer = 0;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 3200); }
  function hideToast() { toastEl.classList.remove('show'); }
  function overlay(html, buttons) {
    const card = $('ovCard'); card.innerHTML = html;
    const box = document.createElement('div'); box.className = 'ov-btns';
    buttons.forEach(([label, fn, alt]) => { const b = document.createElement('button'); b.className = 'ov-btn' + (alt ? ' alt' : ''); b.textContent = label; b.onclick = fn; box.appendChild(b); });
    card.appendChild(box); $('overlay').hidden = false; box.firstChild.focus();
  }
  function hideOverlay() { $('overlay').hidden = true; }
  function showRules() {
    S.paused = true;
    overlay(`<h2>Как играть</h2><ul>
      <li><b>Нажмите на ящик</b> в пробке. Он уедет по стрелке, если путь свободен, и встанет на парковку.</li>
      <li>Если путь закрыт, ящик упрётся в соседа и вернётся назад.</li>
      <li>Фрукты из очереди сами садятся в ящик <b>своего цвета</b>. Цифра под ящиком показывает, сколько мест осталось.</li>
      <li>Полный ящик уезжает и освобождает место.</li>
      <li>Серые ящики с <b>?</b> показывают цвет, когда перед ними освобождается дорога.</li>
      <li><b>Легковушка</b> на парковке занимает место. Она уедет, когда заполнится ящик её цвета. Нажмите на неё, чтобы узнать, какой нужен.</li>
      <li><b>Гараж</b> с цифрой выпускает новый ящик, как только перед ним становится пусто. Цифра показывает, сколько ящиков внутри, а цветная полоска у ворот показывает цвет следующего.</li>
      <li><b>Монеты:</b> +50 за каждый пройденный уровень. <b>VIP</b> (100 монет) открывает новое место на парковке, так же работает нажатие на «+». <b>Перемешать</b> (50 монет) перемешивает фрукты на дорожке. <b>Упорядочить</b> бесплатно один раз за уровень ставит вперёд фрукты для ящиков на парковке.</li>
      <li><b>Дождь:</b> полоска вверху показывает, сколько осталось до ливня. Небо темнеет, а в конце начинается дождь. Не успели отправить урожай, и он испорчен, придётся начать заново.</li>
      <li>Проигрыш: парковка заполнена, а первым фруктам в очереди некуда сесть.</li>
      <li><b>Звёзды:</b> 3 за уровень без помощников, 2 с одним, 1 с двумя и больше.</li></ul>`,
      [['Продолжить', () => { S.paused = false; hideOverlay(); }], ['Уровни', showLevels, true], [progress.muted ? 'Звук: выкл' : 'Звук: вкл', toggleSound, true], ['Меню', () => { hideOverlay(); showMenu(); }, true]]);
  }
  function renderSound() {
    const b = $('soundBtn'), m = progress.muted;
    b.classList.toggle('off', m); b.setAttribute('aria-pressed', m); b.setAttribute('aria-label', m ? 'Включить звук' : 'Выключить звук');
    b.querySelector('.waves').style.display = m ? 'none' : ''; b.querySelector('.cross').style.display = m ? '' : 'none';
    const o = [...$('ovCard').querySelectorAll('.ov-btn')].find(x => x.textContent.startsWith('Звук'));
    if (o) o.textContent = m ? 'Звук: выкл' : 'Звук: вкл';
    const ms = document.getElementById('menuSound'); if (ms) ms.textContent = m ? 'Звук: выкл' : 'Звук: вкл';
  }
  function toggleSound() {
    progress.muted = !progress.muted; saveProgress(); renderSound();
    // cut anything still ringing right away, wake the audio back up when unmuted
    try { if (AC) progress.muted ? AC.suspend() : AC.resume(); } catch (e) {}
    try { if (progress.muted && navigator.vibrate) navigator.vibrate(0); } catch (e) {}
    sfx('tap');
  }
  renderSound();
  function win() {
    hideToast(); sfx('win');
    const stars = Math.max(1, 3 - S.used);
    progress.stars[S.li] = Math.max(progress.stars[S.li] || 0, stars);
    progress.unlocked = Math.max(progress.unlocked, Math.min(LEVEL_COUNT - 1, S.li + 1));
    progress.coins += WIN_COINS; progress.current = Math.min(LEVEL_COUNT - 1, S.li + 1);
    saveProgress(); renderCoins(true); sfx('coins');
    const row = [1, 2, 3].map(i => `<span class="star${i <= stars ? ' on' : ''}">★</span>`).join('');
    const note = stars === 3 ? 'Без помощников!' : 'Пройдите без помощников, чтобы получить 3 звезды.';
    const btns = S.li + 1 < LEVEL_COUNT ? [['Следующий уровень', () => startLevel(S.li + 1)], ['Ещё раз', () => startLevel(S.li), true]]
      : [['Все уровни', showLevels], ['Ещё раз', () => startLevel(S.li), true]];
    overlay(`<div class="ov-ico" aria-hidden="true">🚚</div><h2>Урожай отправлен!</h2><div class="stars">${row}</div><p class="reward"><span class="coin">$</span> +${WIN_COINS}</p><p><b>Урожай успешно отправлен в магазин! Получено ${WIN_COINS} монет.</b></p><p>${note}</p>`, btns);
  }
  function showLevels(fromMenu) {
    S.paused = true;
    const cells = Array.from({ length: LEVEL_COUNT }, (_, i) => {
      const open = i <= progress.unlocked, st = progress.stars[i] || 0;
      return `<button class="lv${i === S.li ? ' cur' : ''}" data-l="${i}" ${open ? '' : 'disabled'} aria-label="Уровень ${i + 1}">${open ? i + 1 : '🔒'}<small>${open ? '★'.repeat(st) + '☆'.repeat(3 - st) : ''}</small></button>`;
    }).join('');
    overlay(`<h2>Уровни</h2><div class="lv-grid">${cells}</div>`, [['Назад', () => { hideOverlay(); if (fromMenu === true) showMenu(); else S.paused = false; }, true]]);
    $('ovCard').querySelectorAll('.lv').forEach(b => b.onclick = () => startLevel(+b.dataset.l));
  }
  function timeUp() {
    hideToast(); sfx('lose'); buzz([60, 60, 60]);
    overlay(`<div class="ov-ico" aria-hidden="true">🌧️</div><h2>Урожай испорчен дождём!</h2><p>Не успели отправить фрукты до ливня. Попробуй ещё раз!</p>`, [['Попробовать снова', () => startLevel(S.li)]]);
  }
  function lose() {
    hideToast(); sfx('lose');
    overlay(`<h2>Парковка заполнена</h2><p>Первым фруктам в очереди некуда сесть.</p>`, [['Попробовать снова', () => startLevel(S.li)]]);
  }

  renderCoins();
  window.harvestState = () => S;
  startLevel(Math.min(progress.current || 0, progress.unlocked));

  // ---------- splash, then the main menu ----------
  const fruitSvg = c => `<svg viewBox="-12 -12 24 24" aria-hidden="true">${FRUIT[c]}</svg>`;
  document.querySelectorAll('[data-fruits]').forEach(el => { el.innerHTML = ORDER.map(fruitSvg).join(''); });
  const splash = $('splash'), menu = $('menu');
  // In the menu Telegram shows its own "Close" button; during play its "Back" button returns here.
  function tgBack(show) { try { if (TG && TG.BackButton) show ? TG.BackButton.show() : TG.BackButton.hide(); } catch (e) {} }
  if (TG) {
    try {
      TG.ready();
      TG.expand();
      if (TG.setHeaderColor) TG.setHeaderColor('#c8d2ea');
      if (TG.setBackgroundColor) TG.setBackgroundColor('#c8d2ea');
      if (TG.disableVerticalSwipes) TG.disableVerticalSwipes(); // a swipe on the board should not close the game
      TG.BackButton.onClick(() => { hideOverlay(); showMenu(); });
    } catch (e) {}
  }
  function showMenu() {
    S.paused = true; tgBack(false);
    $('menuCoins').textContent = progress.coins; $('menuLevel').textContent = `Уровень ${S.li + 1}`;
    menu.hidden = false; menu.classList.add('enter'); menu.classList.remove('out');
    requestAnimationFrame(() => requestAnimationFrame(() => menu.classList.remove('enter')));
  }
  function hideMenu() { menu.classList.add('out'); setTimeout(() => { menu.hidden = true; }, 600); tgBack(true); }
  $('playBtn').addEventListener('click', () => {
    try { if (TG) TG.expand(); } catch (e) {}
    sfx('go'); hideMenu(); S.paused = false; S.lastT = performance.now();
  });
  $('menuLevels').addEventListener('click', () => { hideMenu(); showLevels(true); });
  $('menuSound').addEventListener('click', toggleSound);
  renderSound();
  if (location.hash === '#play') { splash.hidden = true; tgBack(true); }
  else {
    S.paused = true;
    setTimeout(() => { showMenu(); splash.classList.add('out'); setTimeout(() => { splash.hidden = true; }, 650); }, reduce ? 600 : 2000);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
