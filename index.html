<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сбор урожая</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: phone-shaped game card. Top third: fruit queue on a winding farm path that ends at a gate.
   Middle strip: parking row (VIP, 4 open slots, 2 locked "+"). Bottom: a jam of vans with arrows.
   Below the card: three chunky blue helper buttons. One bright, sunny look on purpose. */
:root {
  color-scheme: light;
  --page: #c8d2ea;
  --blue: #3b8cff;
  --blue-top: #63a6ff;
  --blue-dark: #1d5dc4;
  --ink: #1d2340;
  --muted: #4d5677;
  --outline: #333a5c;
  --gold: #ffc83d;
  --green: #34c26d;
  --card: #ffffff;
  --display: "Russo One", "Arial Black", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.wrap { max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.game { position: relative; border-radius: 24px; overflow: hidden; background: #e2e6f3; box-shadow: 0 12px 30px rgba(40,50,90,.25); }
canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 400 / 750; touch-action: manipulation; cursor: pointer; }

.hud { position: absolute; z-index: 8; top: 10px; left: 10px; right: 10px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
.sq { pointer-events: auto; appearance: none; border: 0; width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(var(--blue-top), var(--blue)); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 0 var(--blue-dark), inset 0 2px 0 rgba(255,255,255,.35); }
.hud-r { display: flex; gap: 8px; }
.hud2 { position: absolute; z-index: 8; top: 62px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
.pill { display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px 0 5px; border-radius: 15px; background: rgba(29,35,64,.78); color: #fff; font: 15px var(--display); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.skybar { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 6px; border-radius: 15px; background: rgba(29,35,64,.78); color: #fff; font: 14px var(--display); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.skybar .sb-ico { font-size: 16px; line-height: 1; }
.skybar .sb-track { position: relative; width: 82px; height: 12px; border-radius: 6px; background: linear-gradient(90deg, #2b3a66, #55607f); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
.skybar .sb-track i { position: absolute; inset: 0; transform-origin: left; border-radius: 6px; background: linear-gradient(90deg, #ff7a1a, #ffb52e 45%, #ffe56b); box-shadow: inset 0 2px 0 rgba(255,255,255,.45); }
.skybar #timer { min-width: 34px; text-align: right; }
.skybar.low { background: #3a4a7a; animation: beat .5s ease-in-out infinite alternate; }
.skybar.low .sb-track i { background: linear-gradient(90deg, #e5333d, #ff7a5a); }
.pill.bump { animation: bump .35s ease-out; }
@keyframes beat { to { transform: scale(1.08); } }
@keyframes bump { 40% { transform: scale(1.25); } }
.coin { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3a0, #ffc83d 45%, #d18a00); box-shadow: inset 0 0 0 2px #b87400; display: grid; place-items: center; font: 12px var(--display); color: #8a5600; }
.badge.price { background: var(--gold); color: #6b4300; display: flex; align-items: center; gap: 3px; padding: 0 6px 0 3px; min-width: 0; }
.badge.price .coin { width: 15px; height: 15px; font-size: 9px; }
@media (prefers-reduced-motion: reduce) { .skybar.low, .pill.bump { animation: none; } }
.sq.off { background: linear-gradient(#9aa3bd, #7d87a3); box-shadow: 0 4px 0 #5b6380, inset 0 2px 0 rgba(255,255,255,.35); }
.sq:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-dark); }
.lvl { font: 400 1.45rem var(--display); color: #fff; -webkit-text-stroke: 5px var(--outline); paint-order: stroke fill; letter-spacing: .02em; text-shadow: 0 3px 0 var(--outline); }

.toast { position: absolute; left: 14px; right: 14px; top: 56%; background: rgba(29,35,64,.92); color: #fff; border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: .9rem; line-height: 1.35; text-align: center; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
/* tutorial on level 1: the game dims (except a spotlight on what we talk about), a bubble sits in the centre */
.tut-dim { position: absolute; inset: 0; z-index: 4; background: rgba(0,0,0,.6); pointer-events: auto; }
.tut-dim.free { pointer-events: none; background: none !important; }
.tip { position: absolute; left: 14px; right: 14px; top: 50%; z-index: 6; background: #fffdf4; color: #2a2010; border: 3px solid #ffb52e; border-radius: 22px; padding: 14px 16px 16px;
  font: 600 1.28rem/1.35 var(--body); text-align: center; box-shadow: 0 8px 0 rgba(120,70,0,.25), 0 14px 30px rgba(0,0,0,.4); transform: translateY(-50%); animation: tipIn .3s cubic-bezier(.2,1.5,.4,1) both; }
.tip.low { top: 74%; }
.tip.high { top: 31%; }
.tip b { color: #c25e00; font-weight: 800; }
.tip .tip-who { display: block; font-size: 2.4rem; line-height: 1.1; margin-bottom: 4px; }
.tip.praise .tip-who { font-size: 3.6rem; animation: cheer .8s ease-in-out infinite alternate; }
.tip .tip-step { display: block; font: 400 .78rem var(--display); color: #b39150; letter-spacing: .06em; margin-bottom: 2px; }
.tip .ov-btn { display: block; margin: 12px auto 0; font-size: 1.15rem; padding: 12px 30px; }
.tut-hand { position: absolute; z-index: 7; width: 58px; height: 58px; margin: 0 0 0 -29px; border-radius: 50%; background: #fff; border: 3px solid #1d2340;
  display: grid; place-items: center; font-size: 34px; line-height: 1; pointer-events: none; box-shadow: 0 0 0 5px rgba(255,214,60,.85), 0 6px 14px rgba(0,0,0,.45); animation: poke .8s ease-in-out infinite; }
@keyframes poke { 50% { transform: translateY(10px); } }
@keyframes cheer { to { transform: scale(1.15) rotate(-8deg); } }
@keyframes tipIn { from { opacity: 0; transform: translateY(-50%) scale(.85); } to { opacity: 1; transform: translateY(-50%); } }
.helpers.locked { pointer-events: none; opacity: .55; }
@media (prefers-reduced-motion: reduce) { .tip, .tut-hand, .tip.praise .tip-who { animation: none; } }

.helpers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-top: 6px; }
.helper { appearance: none; border: 0; position: relative; border-radius: 20px; padding: 8px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
  background: linear-gradient(var(--blue-top), var(--blue)); box-shadow: 0 6px 0 var(--blue-dark), inset 0 2px 0 rgba(255,255,255,.35);
  color: #fff; font: 900 .88rem var(--body); text-shadow: 0 2px 0 var(--blue-dark); }
.helper:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--blue-dark); }
.helper[disabled] { filter: grayscale(.9) brightness(.85); cursor: not-allowed; }
.helper.armed { outline: 4px solid var(--gold); outline-offset: 2px; }
.helper .ico { height: 44px; display: grid; place-items: center; }
.helper .ico svg { width: 44px; height: 44px; }
.ball { width: 38px; height: 38px; border-radius: 50%; background: conic-gradient(#ff5a5a, #ffc83d, #4cd964, #3bc4ff, #3b6dff, #b05cff, #ff5ab4, #ff5a5a); box-shadow: inset -5px -6px 0 rgba(0,0,0,.15), inset 4px 4px 0 rgba(255,255,255,.4); }
.badge { position: absolute; top: -8px; right: -6px; min-width: 26px; height: 26px; border-radius: 13px; padding: 0 6px; background: var(--green); border: 2px solid #fff; color: #fff; display: grid; place-items: center; font: 13px var(--display); text-shadow: none; }
.sq:focus-visible, .helper:focus-visible, .ov-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.overlay { position: absolute; z-index: 20; inset: 0; background: rgba(29,35,64,.55); display: grid; place-items: center; padding: 22px; backdrop-filter: blur(2px); }
.overlay[hidden] { display: none; }
.ov-card { background: var(--card); border-radius: 22px; padding: 22px 20px; max-width: 320px; display: flex; flex-direction: column; gap: 10px; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.15); }
.ov-card h2 { margin: 0; font: 400 1.6rem var(--display); color: var(--ink); text-wrap: balance; }
.ov-card p { margin: 0; color: var(--muted); line-height: 1.45; font-weight: 600; }
.ov-card ul { margin: 0; padding-left: 18px; text-align: left; color: var(--muted); line-height: 1.45; font-weight: 600; font-size: .9rem; display: flex; flex-direction: column; gap: 4px; }
.ov-card ul b { color: var(--ink); }
.ov-ico { font-size: 2.6rem; line-height: 1; margin-bottom: 4px; }
.reward { display: flex; align-items: center; justify-content: center; gap: 6px; font: 1.2rem var(--display); color: #b87400; margin: 6px 0 0; }
.stars { display: flex; justify-content: center; gap: 6px; font-size: 2.4rem; line-height: 1; }
.star { color: #d9dcea; }
.star.on { color: var(--gold); text-shadow: 0 3px 0 #c98d00; }
.lv-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lv { appearance: none; border: 0; border-radius: 14px; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer;
  font: 400 1.2rem var(--display); color: #fff; background: linear-gradient(var(--blue-top), var(--blue)); box-shadow: 0 4px 0 var(--blue-dark); }
.lv small { font-size: .62rem; color: #ffe14d; letter-spacing: .05em; min-height: .8em; }
.lv.cur { outline: 3px solid var(--gold); outline-offset: 2px; }
.lv[disabled] { background: #c9cede; box-shadow: 0 4px 0 #a6acc0; cursor: not-allowed; font-size: 1rem; }
.ov-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }
.ov-btn { appearance: none; border: 0; border-radius: 14px; padding: 12px 18px; cursor: pointer; font: 900 1rem var(--body); color: #fff; background: linear-gradient(#4fdc86, var(--green)); box-shadow: 0 4px 0 #1f8a4a; }
.ov-btn.alt { background: linear-gradient(var(--blue-top), var(--blue)); box-shadow: 0 4px 0 var(--blue-dark); }

/* splash + main menu: full screen over everything */
.screen { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px;
  background: linear-gradient(#5cc4ff 0%, #a9e4ff 36%, #d9f6ff 44%, #7ee64a 44.2%, #4fcb2c 70%, #23901a 100%); transition: opacity .6s ease, transform .6s ease; overflow: hidden; }
.screen[hidden] { display: none; }
.screen.out { opacity: 0; pointer-events: none; }
.screen.menu.enter { opacity: 0; transform: scale(1.04); }
.logo { position: relative; text-align: center; }
.logo-fruits { display: flex; justify-content: center; gap: 4px; margin-bottom: -6px; }
.logo-fruits svg { width: 52px; height: 52px; filter: drop-shadow(0 5px 3px rgba(0,60,0,.35)); animation: hop 1.1s ease-in-out infinite; }
.logo-fruits svg:nth-child(2) { animation-delay: .12s; } .logo-fruits svg:nth-child(3) { animation-delay: .24s; }
.logo-fruits svg:nth-child(4) { animation-delay: .36s; } .logo-fruits svg:nth-child(5) { animation-delay: .48s; } .logo-fruits svg:nth-child(6) { animation-delay: .6s; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-12px) rotate(-6deg); } }
.logo h1 { margin: 0; font: 400 clamp(2.6rem, 13vw, 4.2rem)/1 var(--display); color: #ffe14d; letter-spacing: .01em;
  -webkit-text-stroke: 8px #7a3d00; paint-order: stroke fill; text-shadow: 0 6px 0 #7a3d00, 0 12px 18px rgba(0,50,0,.35); transform: rotate(-3deg); }
.logo h1 span { display: block; color: #fff; font-size: .62em; margin-top: 6px; }
.splash .logo { animation: logoIn .7s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes logoIn { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.splash .loading { width: 160px; height: 12px; border-radius: 6px; background: rgba(0,60,0,.3); overflow: hidden; }
.splash .loading i { display: block; height: 100%; width: 0; border-radius: 6px; background: linear-gradient(#fff6a0, #ffc83d); animation: load 1.9s ease-in-out forwards; }
@keyframes load { to { width: 100%; } }
.sun { position: absolute; top: 5%; right: 10%; width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #fff7b0, #ffd23f 55%, #ffab1f);
  box-shadow: 0 0 0 10px rgba(255,220,80,.25), 0 0 40px 18px rgba(255,210,60,.45); animation: glow 3s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 0 0 16px rgba(255,220,80,.18), 0 0 54px 24px rgba(255,210,60,.5); } }
.cloud { position: absolute; width: 110px; height: 34px; border-radius: 20px; background: #fff; opacity: .95; animation: drift linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 50px; height: 50px; left: 16px; top: -26px; }
.cloud::after { width: 38px; height: 38px; left: 54px; top: -18px; }
@keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(calc(100vw + 40px)); } }
.ftree { position: absolute; bottom: 52%; width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #7ee85a, #1f9e2a 70%, #157a1c); box-shadow: 0 4px 0 rgba(0,60,0,.2); }
.ftree::after { content: ""; position: absolute; left: 20px; top: 42px; width: 7px; height: 14px; border-radius: 2px; background: #7a4a22; z-index: -1; }
.story { margin: 0; max-width: 300px; padding: 12px 16px; border-radius: 16px; background: rgba(255,255,255,.92); color: #3a2a10; font: 800 1.02rem/1.35 var(--body); text-align: center; box-shadow: 0 6px 0 rgba(0,60,0,.25); }
.story b { color: #c25e00; }
.menu .logo, .menu .story, .menu .menu-info, .menu .play, .menu .menu-row { position: relative; z-index: 1; }
@media (prefers-reduced-motion: reduce) { .cloud, .sun { animation: none; } }
.menu .logo h1 { font-size: clamp(2.2rem, 11vw, 3.4rem); }
.menu-info { display: flex; gap: 10px; }
.menu-info .pill { height: 36px; font-size: 1rem; padding: 0 14px 0 6px; }
.menu-info .pill.lvl-pill { padding: 0 14px; }
.play { appearance: none; border: 0; cursor: pointer; width: min(280px, 80vw); padding: 18px 0 20px; border-radius: 26px; font: 400 2rem var(--display); color: #fff;
  background: linear-gradient(#ffd84a, #ff9f1c); box-shadow: 0 8px 0 #c25e00, 0 14px 24px rgba(0,50,0,.35), inset 0 3px 0 rgba(255,255,255,.55);
  -webkit-text-stroke: 5px #a34a00; paint-order: stroke fill; animation: pulse 1.4s ease-in-out infinite; }
.play:active { transform: translateY(6px); box-shadow: 0 2px 0 #c25e00; animation: none; }
@keyframes pulse { 50% { transform: scale(1.05); } }
.menu-row { display: flex; gap: 12px; }
.menu-row .sq { width: auto; height: 50px; padding: 0 18px; gap: 8px; display: flex; font: 900 1rem var(--body); }
.deco { position: absolute; bottom: -10px; width: 90px; height: 70px; border-radius: 50% 50% 0 0; background: radial-gradient(circle at 40% 30%, #6fe04a, #17861f); opacity: .9; }
@media (prefers-reduced-motion: reduce) { .logo-fruits svg, .play, .splash .logo { animation: none; } .splash .loading i { animation-duration: .01s; } }
</style>
<style>html, body { margin: 0; } [hidden] { display: none !important; }</style>
</head>
<body>
<div class="wrap">
  <div class="game" id="game">
    <canvas id="cv" width="400" height="750" aria-label="Игровое поле: очередь ящиков, зона ожидания и поле с фруктами"></canvas>
    <div class="hud">
      <button class="sq" id="restartBtn" aria-label="Начать уровень заново">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 3.8v4.6h4.6"/></svg>
      </button>
      <span class="lvl" id="lvl">Уровень 1</span>
      <div class="hud-r">
        <button class="sq" id="soundBtn" aria-label="Выключить звук" aria-pressed="false">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5h3.5l5-4v13l-5-4H3.5z" fill="#fff"/><g class="waves"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.2 6.4a7.6 7.6 0 0 1 0 11.2"/></g><g class="cross" style="display:none"><path d="M15.5 9.2l5 5.6M20.5 9.2l-5 5.6"/></g></svg>
        </button>
        <button class="sq" id="pauseBtn" aria-label="Пауза и правила">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
        </button>
      </div>
    </div>
    <div class="hud2">
      <span class="pill" aria-label="Монеты"><span class="coin">$</span><span id="coins">0</span></span>
      <span class="skybar" id="skybar" role="timer" aria-label="Время до дождя"><span class="sb-ico" aria-hidden="true">☀️</span><span class="sb-track"><i id="timerFill"></i></span><span id="timer">2:00</span><span class="sb-ico" aria-hidden="true">🌧️</span></span>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="tut-dim" id="tutDim" hidden></div>
    <div class="tut-hand" id="tutHand" aria-hidden="true" hidden>👆</div>
    <div class="tip" id="tip" role="dialog" aria-live="polite" hidden></div>
    <div class="overlay" id="overlay" hidden>
      <div class="ov-card" id="ovCard"></div>
    </div>
  </div>

  <div class="helpers" id="helpers">
    <button class="helper" id="vipBtn">
      <span class="ico"><svg viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="4" rx="2" fill="#ffd36b"/><rect x="22" y="8" width="4" height="8" fill="#9a6a00"/><rect x="8" y="16" width="32" height="20" rx="8" fill="#ff9f1c"/><rect x="26" y="19" width="10" height="9" rx="3" fill="#bfe6ff"/><circle cx="15" cy="37" r="4" fill="#2b2f45"/><circle cx="33" cy="37" r="4" fill="#2b2f45"/></svg></span>
      VIP<span class="badge price"><span class="coin">$</span>100</span>
    </button>
    <button class="helper" id="sortBtn">
      <span class="ico"><svg viewBox="0 0 48 48"><path d="M10 8h9v18a5 5 0 0 0 10 0V8h9v18a14 14 0 0 1-28 0z" fill="#e5333d" stroke="#8a1820" stroke-width="2"/><rect x="10" y="8" width="9" height="8" fill="#dfe5ee" stroke="#5b6478" stroke-width="2"/><rect x="29" y="8" width="9" height="8" fill="#dfe5ee" stroke="#5b6478" stroke-width="2"/><path d="M14 22a10 10 0 0 0 4 10" stroke="#ff9a9f" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg></span>
      Магнит<span class="badge" id="sortCount">1</span>
    </button>
    <button class="helper" id="shuffleBtn">
      <span class="ico"><span class="ball"></span></span>
      Перемешать<span class="badge price"><span class="coin">$</span>50</span>
    </button>
  </div>
</div>

<div class="screen splash" id="splash" aria-label="Сбор урожая">
  <span class="sun" aria-hidden="true"></span><span class="cloud" style="top:9%;animation-duration:38s;animation-delay:-12s" aria-hidden="true"></span><span class="cloud" style="top:22%;animation-duration:52s;animation-delay:-30s;transform:scale(.8)" aria-hidden="true"></span>
  <span class="ftree" style="left:6%" aria-hidden="true"></span><span class="ftree" style="left:20%;width:34px;height:34px" aria-hidden="true"></span><span class="ftree" style="right:8%;width:40px;height:40px" aria-hidden="true"></span>
    <div class="logo"><div class="logo-fruits" data-fruits></div><h1>Сбор<span>урожая</span></h1></div>
  <div class="loading" aria-hidden="true"><i></i></div>
  <span class="deco" style="left:-20px"></span><span class="deco" style="right:-24px;width:110px"></span>
</div>
<div class="screen menu" id="menu" hidden>
  <span class="sun" aria-hidden="true"></span><span class="cloud" style="top:9%;animation-duration:38s;animation-delay:-12s" aria-hidden="true"></span><span class="cloud" style="top:22%;animation-duration:52s;animation-delay:-30s;transform:scale(.8)" aria-hidden="true"></span>
  <span class="ftree" style="left:6%" aria-hidden="true"></span><span class="ftree" style="left:20%;width:34px;height:34px" aria-hidden="true"></span><span class="ftree" style="right:8%;width:40px;height:40px" aria-hidden="true"></span>

    <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1=".45" k2=".7" result="lit"/>
    <feSpecularLighting in="b" surfaceScale="3" specularConstant="1" specularExponent="22" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="42"/></feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
    <feComposite in="lit" in2="s2" operator="arithmetic" k2="1" k3=".9"/></filter>`;
  const GLOSS = { red: [-4.5, -2, 2.2, 3.4, 25], yellow: [-6.2, -3, 1.1, 3.2, 10], green: [-5.5, -2.5, 2.2, 3.6, 25], blue: [-4.5, -3.5, 2.6, 3.8, 35], purple: [-5.6, -5, 1.4, 1.9, 35], orange: [-4.5, -3, 2.6, 3.8, 35] };
  const glossSvg = c => { const [x, y, rx, ry, a] = GLOSS[c]; return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#gl)" transform="rotate(${a} ${x} ${y})"/><circle cx="${x + rx * .3}" cy="${y - ry * .45}" r="${Math.min(rx, ry) * .45}" fill="#fff"/>`; };
  const GL_DEF = `<radialGradient id="gl" cx=".45" cy=".35" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`;
  const IMG = {};
  for (const c of ORDER) {
    const im = new Image(), cnv = document.createElement('canvas');
    cnv.width = cnv.height = 64; cnv.complete = false; IMG[c] = cnv;
    im.onload = () => {

    };
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24" width="112" height="112"><defs>${LIGHT}${GL_DEF}</defs><g filter="url(#v)" style="filter:url(#v) saturate(1.25)">${FRUIT[c]}</g>${glossSvg(c)}</svg>`);
  }

  // Each level: how many crates (3 fruits each), how many colours, how much the order is
  // shuffled away from the crate order (the puzzle), and how many fruits start hidden.
  const LEVEL_COUNT = 15;
  const levelCfg = li => [
    { crates: 5, colors: 3, mix: 6, hidden: 0 },
    { crates: 7, colors: 4, mix: 12, hidden: 0 },
    { crates: 9, colors: 4, mix: 18, hidden: .1 },
    { crates: 11, colors: 5, mix: 26, hidden: .15 },
    { crates: 12, colors: 5, mix: 34, hidden: .2 },
  ][li] || { crates: Math.min(18, 12 + (li - 4)), colors: 6, mix: 40 + li * 6, hidden: .25 };
  // seconds on the clock: 2 minutes, a little more on the bigger levels
  const timeFor = li => 120 + Math.min(60, Math.max(0, li - 4) * 6);

  // ---------- geometry (logical 400 × 750) ----------
  const W = 400, H = 750;
  const ROWGAP = 19, LANEGAP = 17, FRUIT_PX = 19, ROAD = 58;
  const STRIP_Y = 305, ROAD_Y = 404, SLOT_Y = 352, SLOT_W = 44, SLOT_H = 68;
  const slotX = i => 44 + i * 52;
  const COLS = 10, ROWS = 9, CELL = 34, GX = 30, GY = 424;
  // the fruit field (Bus Jam style): fruits leave through the top edge
  const FC = 9, FR_MAX = 7, FCELL = 38, FGX = (400 - 9 * 38) / 2, FGY = 444, FRUIT_GRID = 30;
  const OPEN_SLOTS = 5, PAID_SLOTS = 2, CRATE_CAP = 3, CRATE_GAP = 56;
  const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
  const ANG = { R: 0, D: Math.PI / 2, L: Math.PI, U: -Math.PI / 2 };
  const inMask = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS && Math.abs(c + .5 - COLS / 2) <= 1.6 + r * .5;

  const NS = 'http://www.w3.org/2000/svg';
  const hiddenSvg = document.createElementNS(NS, 'svg');
  hiddenSvg.setAttribute('width', '0'); hiddenSvg.setAttribute('height', '0'); hiddenSvg.style.position = 'absolute';
  document.body.appendChild(hiddenSvg);

  // Track shapes. Fruits walk along each arm towards its end. Without a ring the arm ends at the gate;
  // with a ring the arm pours into a loop that keeps turning, and fruits board when their row passes the gate.
  // All bends are circular arcs wide enough that the inner lane never squeezes fruits together.
  const RING_C = { x: 200, y: 175, r: 80 };
  const RING_D = 'M 200 255 A 80 80 0 1 1 200 95 A 80 80 0 1 1 200 255';
  const LOOP_L = 'M 40 -30 V 115 A 60 60 0 0 0 100 175 H 120';
  const LOOP_R = 'M 360 -30 V 115 A 60 60 0 0 1 300 175 H 280';
  const LAYOUTS = {
    single:   { arms: ['M 430 85 H 130 A 50 50 0 0 0 80 135 V 185 A 50 50 0 0 0 130 235 H 150 A 50 50 0 0 1 200 285 V 312'], ring: false, gate: [171, 229] },
    fork:     { arms: ['M 60 -30 V 70 C 60 160 170 140 170 230 V 312', 'M 340 -30 V 70 C 340 160 230 140 230 230 V 312'], ring: false, gate: [141, 259] },
    loop:     { arms: [LOOP_L], ring: true, gate: [171, 229] },
    forkloop: { arms: [LOOP_L, LOOP_R], ring: true, gate: [171, 229] },
  };
  const layoutFor = li => li < 5 ? 'single' : li < 9 ? 'fork' : (li % 2 ? 'forkloop' : 'loop');
  // Each lane is its own offset curve, resampled every 1px, so fruits in a lane sit at exactly ROWGAP apart.
  function buildLanes(X, Y, closed) {
    const n = X.length, lanes = [];
    for (let l = 0; l < 3; l++) {
      const off = (l - 1) * LANEGAP, px = [], py = [];
      for (let i = 0; i < n; i++) {
        let a = i - 1, b = i + 1;
        if (closed) { a = (a + n - 1) % (n - 1); b = b % (n - 1); } else { a = Math.max(0, a); b = Math.min(n - 1, b); }
        const tx = X[b] - X[a], ty = Y[b] - Y[a], len = Math.hypot(tx, ty) || 1;
        px.push(X[i] - ty / len * off); py.push(Y[i] + tx / len * off);
      }
      const lx = [px[0]], ly = [py[0]]; let acc = 0, need = 1;
      for (let i = 1; i < n; i++) {
        const seg = Math.hypot(px[i] - px[i - 1], py[i] - py[i - 1]);
        while (seg > 0 && acc + seg >= need) { const t = (need - acc) / seg; lx.push(px[i - 1] + (px[i] - px[i - 1]) * t); ly.push(py[i - 1] + (py[i] - py[i - 1]) * t); need++; }
        acc += seg;
      }
      lanes.push({ X: lx, Y: ly, L: lx.length - 1 });
    }
    return lanes;
  }
  function lanePt(lane, d) {
    d = Math.max(0, Math.min(lane.L, d)); const i = Math.min(lane.L - 1, Math.floor(d)), t = d - i;
    return { x: lane.X[i] + (lane.X[i + 1] - lane.X[i]) * t, y: lane.Y[i] + (lane.Y[i + 1] - lane.Y[i]) * t };
  }

    const el = document.createElementNS(NS, 'path'); el.setAttribute('d', d); hiddenSvg.appendChild(el);
    const L = el.getTotalLength(), X = [], Y = [];
    for (let i = 0; i <= Math.ceil(L); i++) { const p = el.getPointAtLength(Math.min(i, L)); X.push(p.x); Y.push(p.y); }
    el.remove();
    return { L, X, Y, p2d: new Path2D(d), lanes: buildLanes(X, Y, closed) };
  }
  const RING_T = samplePath(RING_D, true);
  const RING_K = Math.floor(Math.min(...RING_T.lanes.map(l => l.L)) / 17.5);
  const RING_SPEED = 2.4; // ring slots per second
  const TRACKS = {};
  for (const [name, lay] of Object.entries(LAYOUTS)) {
    TRACKS[name] = lay.arms.map(d => {
      const t = samplePath(d, false);
      t.stop = 12;
      if (lay.ring) { // where on the ring this arm pours in (0 = gate, grows along the flow); fruits wait clear of the ring
        const ex = t.X[t.X.length - 1], ey = t.Y[t.Y.length - 1]; let best = 0, bd = 1e9;
        for (let i = 0; i < RING_T.X.length; i++) { const dd = Math.hypot(RING_T.X[i] - ex, RING_T.Y[i] - ey); if (dd < bd) { bd = dd; best = i; } }

  // ---------- canvas ----------
  const $ = id => document.getElementById(id);
  const cv = $('cv'); let ctx = cv.getContext('2d');

  function rng(seed) {
    return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);

  // ---------- level generation ----------
  // Plays a sending order through the crate queue and returns the most fruits ever waiting
  // (Infinity if a fruit would find no place).
  function simulate(seq, crates, cap) {
    let cur = 0, load = 0, most = 0; const wait = [];
    const pull = () => {
      while (cur < crates.length) {
        if (load === CRATE_CAP) { cur++; load = 0; continue; }
        const i = wait.indexOf(crates[cur]); if (i < 0) break;
        wait.splice(i, 1); load++;

    for (const c of seq) {
      if (cur < crates.length && c === crates[cur]) { load++; pull(); }
      else { wait.push(c); most = Math.max(most, wait.length); if (wait.length > cap) return Infinity; }
    }

  // Builds a level that is always solvable: we pick a sending order that never overflows the
  // waiting area, then place the fruits so that this order can actually be tapped (each fruit
  // can reach the top edge once the fruits sent before it are gone).
  function generate(li) {
    const cfg = levelCfg(li), rand = rng(4242 + li * 7919);
    const colors = ORDER.slice(0, cfg.colors);
    const carCount = li >= 11 ? 2 : li >= 6 ? 1 : 0;
    // crate order: every colour appears, no colour three times in a row
    const crates = [];
    for (let i = 0; i < cfg.crates; i++) {
      let c;
      do { c = i < colors.length ? colors[i] : colors[Math.floor(rand() * colors.length)]; }
      while (crates.length >= 2 && crates[crates.length - 1] === c && crates[crates.length - 2] === c);
      crates.push(c);
    }
    shuffle(crates, rand);
    const cars = []; const pool = [...new Set(crates.slice(2))];
    for (let k = 0; k < carCount && pool.length; k++) cars.push(pool.splice(Math.floor(rand() * pool.length), 1)[0]);
    const cap = OPEN_SLOTS - cars.length - 1; // keep one place spare for the player
    const seq = crates.flatMap(c => [c, c, c]);
    for (let k = 0, tries = 0; k < cfg.mix && tries < cfg.mix * 40; tries++) {
      const i = Math.floor(rand() * (seq.length - 1)), j = Math.min(seq.length - 1, i + 1 + Math.floor(rand() * 6));
      if (seq[i] === seq[j]) continue;
      [seq[i], seq[j]] = [seq[j], seq[i]];
      if (simulate(seq, crates, cap) === Infinity) [seq[i], seq[j]] = [seq[j], seq[i]]; else k++;
    }
    // pack the fruits tightly from the top (a few holes), then peel them off in a random order
    // that is always possible: each fruit can reach the top edge once the ones before it are gone
    const rows = Math.min(FR_MAX, Math.ceil(seq.length / (FC * .88)));
    const cells = []; for (let r = 0; r < rows; r++) for (let c = 0; c < FC; c++) cells.push(c + ',' + r);
    const occ = new Set(shuffle(cells, rand).slice(0, seq.length));
    const gone = new Set(cells.filter(k => !occ.has(k)));
    const reach = k => { // can the cell k reach the top edge through gone cells?
      const [c0, r0] = k.split(',').map(Number); if (r0 === 0) return true;
      const seen = new Set([k]), q = [[c0, r0]];
      while (q.length) {
        const [c, r] = q.shift();
        for (const [dc, dr] of [[0, -1], [-1, 0], [1, 0], [0, 1]]) {
          const nc = c + dc, nr = r + dr, kk = nc + ',' + nr;
          if (nc < 0 || nc >= FC || nr < 0 || nr >= rows || seen.has(kk) || !gone.has(kk)) continue;
          if (nr === 0) return true;
          seen.add(kk); q.push([nc, nr]);
        }
      }
      return false;
    };
    const fruits = [];
    for (let n = 0; n < seq.length; n++) {
      const cand = [...occ].filter(reach);
      // prefer deeper fruits now and then, so the needed colours are buried under others
      cand.sort((x, y) => +y.split(',')[1] - +x.split(',')[1]);
      const k = cand[rand() < .4 ? 0 : Math.floor(rand() * cand.length)];
      occ.delete(k); gone.add(k);
      const [c, r] = k.split(',').map(Number);
      fruits.push({ c, r, color: seq[n], hidden: r > 0 && rand() < cfg.hidden });
    }
    return { crates, fruits, cars, rows };
  }

  // ---------- progress (this browser only) ----------
  const progress = { unlocked: 0, current: 0, stars: {}, muted: false, coins: 150 };
  try { Object.assign(progress, JSON.parse(localStorage.getItem('harvest-progress') || '{}')); } catch (e) {}
  function saveProgress() { try { localStorage.setItem('harvest-progress', JSON.stringify(progress)); } catch (e) {} }
  const PRICE = { slot: 100, shuffle: 50 }, WIN_COINS = 50;
  function renderCoins(bump) {
    const el = document.getElementById('coins'); el.textContent = progress.coins;
    if (bump) { const p = el.parentNode; p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); }
  }
  function pay(cost) {
    if (progress.coins < cost) { toast(`Недостаточно монет. Нужно ${cost}, а у вас ${progress.coins}. Монеты дают за пройденные уровни.`); sfx('bump'); return false; }
    progress.coins -= cost; saveProgress(); renderCoins(true); return true;
  }

  // ---------- sound ----------
  let AC = null;
  function tone(f1, f2, dur, type, vol, delay = 0) {
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, f1, f2, q, vol, delay = 0) {
    const t = AC.currentTime + delay, n = Math.ceil(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = buf; bp.type = 'bandpass'; bp.Q.value = q;
    bp.frequency.setValueAtTime(f1, t); bp.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * .25); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(AC.destination); src.start(t); src.stop(t + dur + .02);
  }
  // light haptic tap, only on touch phones that support it (iPhone Safari does not)

    b: [
      { who: '👍', text: 'Отлично! Фрукт уже <b>в ящике</b>.', at: 'crate' },
      { who: '🅿️', text: 'Фрукт <b>другого цвета</b> ждёт здесь, на парковке.', at: 'park', low: true },
      { who: '⚠️', text: 'Мест мало! Займёшь все, и уровень <b>проигран</b>.', at: 'park', low: true, btn: 'Понятно' },
    ],
    c: [
      { who: '🚚', text: 'Ящик полный и уехал! Едет <b>следующий</b>.', at: 'crate' },
      { who: '🎯', text: 'Убери <b>все фрукты</b> с поля, и уровень пройден!', at: 'field' },
      { who: '🏆', text: '<b>Молодец!</b> Ты всё понял. Вперёд!', btn: 'Играть!', praise: true },
    ],
  };
  function tutStart() {
    S.tut = 0; tutHide();
    if (S.li !== 0 || progress.tutorialDone) return;
    // remembered right away, so a restart of level 1 goes straight to the game
    progress.tutorialDone = true; saveProgress();
    S.tut = { open: false, seen: {}, queue: [], msg: null, point: null };
    tutPhase('a');
  }
  function tutPhase(name) {
    const T = S.tut; if (!T || T.seen[name]) return;
    T.seen[name] = true;
    if (T.open) { T.queue.push(name); return; }
    tutShow(name, 0);
  }
  function tutShow(name, i) {
    const T = S.tut, m = TUT[name][i], tip = $('tip');
    T.open = true; T.msg = m; T.point = m.at || null;
    const all = Object.values(TUT).flat(), n = all.indexOf(m) + 1;
    // the bubble stays centred, but steps away from what it points at so that stays visible
    const place = m.at === 'crate' || m.at === 'park' ? ' low' : m.at === 'fruit' || m.at === 'field' ? ' high' : '';
    tip.className = 'tip' + place + (m.praise ? ' praise' : '');
    tip.innerHTML = `${m.praise ? '' : `<span class="tip-step">ОБУЧЕНИЕ · ${n} / ${all.length - 1}</span>`}<span class="tip-who" aria-hidden="true">${m.who}</span>${m.text}`;
    const b = document.createElement('button'); b.className = 'ov-btn'; b.textContent = m.btn || 'Далее';
    b.onclick = () => {
      if (i + 1 < TUT[name].length) { tutShow(name, i + 1); return; }
      T.open = false; T.point = m.then || null; tip.hidden = true;
      if (T.queue.length) { tutShow(T.queue.shift(), 0); return; }
      if (name === 'c') { S.tut = 0; tutHide(); S.lastT = performance.now(); }
      $('helpers').classList.remove('locked');
    };
    tip.appendChild(b);
    tip.hidden = false; tip.style.animation = 'none'; void tip.offsetWidth; tip.style.animation = '';
    $('tutDim').hidden = false; $('helpers').classList.add('locked');
    if (m.praise) { burst(200, 300, 'yellow'); sfx('win'); } else sfx('pop');
    b.focus({ preventScroll: true });
  }
  function tutHide() { $('tip').hidden = true; $('tutDim').hidden = true; $('tutHand').hidden = true; $('helpers').classList.remove('locked'); }
  // where the spotlight and the pointing hand go, in game units: [x, y, half-width, half-height]
  function tutTarget(kind) {
    if (kind === 'crate') { const c = S.tut.point === 'crate' && S.tutCrate && !S.tut.seen.c ? S.tutCrate : current(); return c && [c.x, c.y, 40, 32]; }
    if (kind === 'park') return [slotX(0) + (slotX(OPEN_SLOTS - 1) - slotX(0)) / 2, SLOT_Y, 134, 42];
    if (kind === 'field') return [FGX + FC * FCELL / 2, FGY + FR * FCELL / 2, FC * FCELL / 2 + 26, FR * FCELL / 2 + 26];
    if (kind === 'fruit') {
      const cr = current(); let f = S.tutFruit && S.grid.get(S.tutFruit.c + ',' + S.tutFruit.r) === S.tutFruit && canGo(S.tutFruit) ? S.tutFruit : null;
      if (!f) { const free = [...S.grid.values()].filter(o => !o.hidden && canGo(o)); f = S.tutFruit = free.find(o => cr && o.color === cr.color) || free[0]; }
      if (!f) return null; const p = cellXY(f.c, f.r); return [p.x, p.y, 24, 24];
    }
    return null;
  }
  function tutTrack() {
    const T = S.tut, dim = $('tutDim'), hand = $('tutHand'), k = cv.getBoundingClientRect().width / W;
    // once the player has done what we asked, the pointer goes away
    if (!T.open && T.point === 'fruit' && T.seen.b) T.point = null;
    const t = T.point && tutTarget(T.point);
    dim.classList.toggle('free', !T.open);
    if (T.open) dim.style.background = t
      ? `radial-gradient(ellipse ${t[2] * k * 1.25}px ${t[3] * k * 1.25}px at ${t[0] * k}px ${t[1] * k}px, rgba(0,0,0,0) 80%, rgba(0,0,0,.6) 100%)`
      : 'rgba(0,0,0,.6)';
    hand.hidden = !t;
    if (t) { hand.style.left = t[0] * k + 'px'; hand.style.top = (t[1] + Math.min(t[3], 26)) * k + 'px'; }
  }

  function tickTimer(dt) {
    if (S.over || S.paused || S.tut || !$('overlay').hidden) return;
    S.time = Math.max(0, S.time - dt);
    $('timerFill').style.transform = `scaleX(${(S.time / S.timeMax).toFixed(4)})`;
    const sec = Math.ceil(S.time);
    if (sec !== S.timeShown) {
      S.timeShown = sec;
      const el = $('timer'); el.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
      $('skybar').classList.toggle('low', sec <= 15);
      if (sec <= 5 && sec > 0) sfx('tick');
    }
    if (S.time <= 0) { S.over = true; timeUp(); }
  }
  let lastFrame = 0;
  function frame(now) {
    if (S) {
      tickTimer(Math.min(.25, (now - (lastFrame || now)) / 1000));
      update(now);
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.clearRect(0, 0, W, H);
      drawScene(now);
      if (S.tut) tutTrack();
    }
    lastFrame = now;
    requestAnimationFrame(frame);
  }

  // ---------- messages ----------
  const toastEl = $('toast'); let toastTimer = 0;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 3200); }
  function hideToast() { toastEl.classList.remove('show'); }
  function overlay(html, buttons) {
    const card = $('ovCard'); card.innerHTML = html;
    const box = document.createElement('div'); box.className = 'ov-btns';
    buttons.forEach(([label, fn, alt]) => { const b = document.createElement('button'); b.className = 'ov-btn' + (alt ? ' alt' : ''); b.textContent = label; b.onclick = fn; box.appendChild(b); });
    card.appendChild(box); $('overlay').hidden = false; box.firstChild.focus();
  }
  function hideOverlay() { $('overlay').hidden = true; }
  function showRules() {
    S.paused = true;
    overlay(`<h2>Как играть</h2><ul>
      <li><b>Ящики едут строгой очередью.</b> Загружается только первый ящик, который стоит у ворот, на 3 фрукта.</li>
      <li><b>Нажмите на фрукт</b> в поле внизу. Он выйдет через верхний край, только если к нему есть свободный путь: светящиеся фрукты могут идти, тёмные заперты.</li>
      <li>Если цвет фрукта совпадает с ящиком, он запрыгнет в ящик. Если нет, встанет в <b>зону ожидания</b> (места на парковке) и сам запрыгнет, когда приедет его ящик.</li>
      <li><b>Проигрыш:</b> фрукту некуда встать, потому что зона ожидания заполнена. Думайте, какой фрукт запустить сейчас, чтобы не забить места.</li>
      <li>Фрукты под <b>?</b> показывают цвет, когда к ним открывается путь.</li>
      <li><b>Легковушка</b> занимает место в зоне ожидания. Она уедет, когда отправится ящик её цвета.</li>
      <li><b>Монеты:</b> +50 за уровень. <b>VIP</b> (100 монет) открывает ещё место в зоне ожидания, как и нажатие на «+». <b>Перемешать</b> (50 монет) перемешивает фрукты в поле. <b>Магнит</b> бесплатно один раз за уровень притягивает в текущий ящик нужные фрукты, даже запертые.</li>
      <li><b>Дождь:</b> полоска вверху показывает, сколько осталось до ливня. Небо темнеет, а в конце начинается дождь. Не успели отправить урожай, и он испорчен, придётся начать заново.</li>
            <li><b>Звёзды:</b> 3 за уровень без помощников, 2 с одним, 1 с двумя и больше.</li></ul>`,
      [['Продолжить', () => { S.paused = false; hideOverlay(); }], ['Уровни', showLevels, true], [progress.muted ? 'Звук: выкл' : 'Звук: вкл', toggleSound, true], ['Меню', () => { hideOverlay(); showMenu(); }, true]]);
  }
  function renderSound() {
    const b = $('soundBtn'), m = progress.muted;
    b.classList.toggle('off', m); b.setAttribute('aria-pressed', m); b.setAttribute('aria-label', m ? 'Включить звук' : 'Выключить звук');
    b.querySelector('.waves').style.display = m ? 'none' : ''; b.querySelector('.cross').style.display = m ? '' : 'none';
    const o = [...$('ovCard').querySelectorAll('.ov-btn')].find(x => x.textContent.startsWith('Звук'));
    if (o) o.textContent = m ? 'Звук: выкл' : 'Звук: вкл';
    const ms = document.getElementById('menuSound'); if (ms) ms.textContent = m ? 'Звук: выкл' : 'Звук: вкл';
  }
  function toggleSound() {
    progress.muted = !progress.muted; saveProgress(); renderSound();
    // cut anything still ringing right away, wake the audio back up when unmuted
    try { if (AC) progress.muted ? AC.suspend() : AC.resume(); } catch (e) {}
    try { if (progress.muted && navigator.vibrate) navigator.vibrate(0); } catch (e) {}
    sfx('tap');
  }
  renderSound();
  function win() {
    hideToast(); sfx('win');
    const stars = Math.max(1, 3 - S.used);
    progress.stars[S.li] = Math.max(progress.stars[S.li] || 0, stars);
    progress.unlocked = Math.max(progress.unlocked, Math.min(LEVEL_COUNT - 1, S.li + 1));
    progress.coins += WIN_COINS; progress.current = Math.min(LEVEL_COUNT - 1, S.li + 1);
    saveProgress(); renderCoins(true); sfx('coins');
    const row = [1, 2, 3].map(i => `<span class="star${i <= stars ? ' on' : ''}">★</span>`).join('');
    const note = stars === 3 ? 'Без помощников!' : 'Пройдите без помощников, чтобы получить 3 звезды.';
    const btns = S.li + 1 < LEVEL_COUNT ? [['Следующий уровень', () => startLevel(S.li + 1)], ['Ещё раз', () => startLevel(S.li), true]]
      : [['Все уровни', showLevels], ['Ещё раз', () => startLevel(S.li), true]];
    overlay(`<div class="ov-ico" aria-hidden="true">🚚</div><h2>Урожай отправлен!</h2><div class="stars">${row}</div><p class="reward"><span class="coin">$</span> +${WIN_COINS}</p><p><b>Урожай успешно отправлен в магазин! Получено ${WIN_COINS} монет.</b></p><p>${note}</p>`, btns);
  }
  function showLevels(fromMenu) {
    S.paused = true;
    const cells = Array.from({ length: LEVEL_COUNT }, (_, i) => {
      const open = i <= progress.unlocked, st = progress.stars[i] || 0;
      return `<button class="lv${i === S.li ? ' cur' : ''}" data-l="${i}" ${open ? '' : 'disabled'} aria-label="Уровень ${i + 1}">${open ? i + 1 : '🔒'}<small>${open ? '★'.repeat(st) + '☆'.repeat(3 - st) : ''}</small></button>`;
    }).join('');
    overlay(`<h2>Уровни</h2><div class="lv-grid">${cells}</div>`, [['Назад', () => { hideOverlay(); if (fromMenu === true) showMenu(); else S.paused = false; }, true]]);
    $('ovCard').querySelectorAll('.lv').forEach(b => b.onclick = () => startLevel(+b.dataset.l));
  }
  function timeUp() {
    hideToast(); sfx('lose'); buzz([60, 60, 60]);
    overlay(`<div class="ov-ico" aria-hidden="true">🌧️</div><h2>Урожай испорчен дождём!</h2><p>Не успели отправить фрукты до ливня. Попробуй ещё раз!</p>`, [['Попробовать снова', () => startLevel(S.li)]]);
  }
  function lose() {
    hideToast(); sfx('lose');
    overlay(`<h2>Парковка заполнена</h2><p>Первым фруктам в очереди некуда сесть.</p>`, [['Попробовать снова', () => startLevel(S.li)]]);
  }

  renderCoins();
  window.harvestState = () => S;
  startLevel(Math.min(progress.current || 0, progress.unlocked));

  // ---------- splash, then the main menu ----------
  const fruitSvg = c => `<svg viewBox="-12 -12 24 24" aria-hidden="true">${FRUIT[c]}</svg>`;
  document.querySelectorAll('[data-fruits]').forEach(el => { el.innerHTML = ORDER.map(fruitSvg).join(''); });
  const splash = $('splash'), menu = $('menu');
  // In the menu Telegram shows its own "Close" button; during play its "Back" button returns here.
  function tgBack(show) { try { if (TG && TG.BackButton) show ? TG.BackButton.show() : TG.BackButton.hide(); } catch (e) {} }
  if (TG) {
    try {
      TG.ready();
      TG.expand();
      if (TG.setHeaderColor) TG.setHeaderColor('#c8d2ea');
      if (TG.setBackgroundColor) TG.setBackgroundColor('#c8d2ea');
      if (TG.disableVerticalSwipes) TG.disableVerticalSwipes(); // a swipe on the board should not close the game
      TG.BackButton.onClick(() => { hideOverlay(); showMenu(); });
    } catch (e) {}
  }
  function showMenu() {
    S.paused = true; tgBack(false);
    $('menuCoins').textContent = progress.coins; $('menuLevel').textContent = `Уровень ${S.li + 1}`;
    menu.hidden = false; menu.classList.add('enter'); menu.classList.remove('out');
    requestAnimationFrame(() => requestAnimationFrame(() => menu.classList.remove('enter')));
  }
  function hideMenu() { menu.classList.add('out'); setTimeout(() => { menu.hidden = true; }, 600); tgBack(true); }
  $('playBtn').addEventListener('click', () => {
    try { if (TG) TG.expand(); } catch (e) {}
    sfx('go'); hideMenu(); S.paused = false; S.lastT = performance.now();
  });
  $('menuLevels').addEventListener('click', () => { hideMenu(); showLevels(true); });
  $('menuSound').addEventListener('click', toggleSound);
  renderSound();
  if (location.hash === '#play') { splash.hidden = true; tgBack(true); }
  else {
    S.paused = true;
    setTimeout(() => { showMenu(); splash.classList.add('out'); setTimeout(() => { splash.hidden = true; }, 650); }, reduce ? 600 : 2000);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
